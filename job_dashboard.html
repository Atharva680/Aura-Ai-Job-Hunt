    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            --color-3h: #f43f5e;
            --color-5h: #fb923c;
            --color-8h: #fbbf24;
            --color-12h: #a3e635;
            --color-24h: #22d3ee;
            --color-1d: #818cf8;
            --color-7d: #94a3b8;

            --radius: 8px;
            --gap: 1rem;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f1f5f9;
                --surface: #ffffff;
                --surface-light: #f8fafc;
                --text-primary: #0f172a;
                --text-secondary: #475569;
                --text-muted: #94a3b8;
            }
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 2rem;
        }

        .brand h1 {
            margin: 0;
            font-size: 1.875rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .brand p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .timestamp {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--surface);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid var(--surface-light);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: var(--gap);
            margin-bottom: 2rem;
        }

        .stat-tile {
            background: var(--surface);
            padding: 1.25rem;
            border-radius: var(--radius);
            border: 1px solid var(--surface-light);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            transition: transform 0.1s ease, border-color 0.2s ease;
            cursor: pointer;
            user-select: none;
        }

        .stat-tile:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .stat-tile.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .stat-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
        }

        .job-feed {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--surface-light);
            overflow: hidden;
        }

        .feed-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--surface-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.05);
        }

        .feed-title {
            font-weight: 600;
            font-size: 1rem;
        }

        .job-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .job-item {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--surface-light);
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            gap: 1.5rem;
            align-items: center;
            transition: background 0.2s ease;
        }

        .job-item:last-child {
            border-bottom: none;
        }

        .job-item:hover {
            background: var(--surface-light);
        }

        .recency-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .job-info h3 {
            margin: 0 0 0.25rem 0;
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .job-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            align-items: center;
            flex-wrap: wrap;
        }

        .meta-tag {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .job-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .job-link {
            text-decoration: none;
            background: var(--accent);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: filter 0.2s ease;
        }

        .job-link:hover {
            filter: brightness(1.1);
        }

        .tailor-btn {
            text-decoration: none;
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--surface-light);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .tailor-btn:hover {
            background: var(--surface-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        .empty-state {
            padding: 4rem 2rem;
            text-align: center;
            color: var(--text-secondary);
        }

        .badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            background: var(--surface-light);
            color: var(--text-primary);
            border: 1px solid var(--text-muted);
        }
    </style>
</head>

gineering tasks.\n\n**What we're looking for:**\n\n**Essential**\n\n- Strong product ownership background, ideally managing a portfolio of products or initiatives across multiple functions in an AI, data, digital or knowledge-intensive environment in a business change context\n\n<!--THE END-->\n\n- Good understanding of how generative AI and related technologies can be applied to business processes (this role is not about having deep engineering expertise)\n\n<!--THE END-->\n\n- Ability to quickly understand different business functions and complex processes, and translate them into clear product requirements, priorities and measurable outcomes\n\n<!--THE END-->\n\n- Strong analytical and critical-thinking skills, with the ability to challenge AI outputs and understand issues such as hallucination, bias, confidence and evidence quality\n\n<!--THE END-->\n\n- Experience working across multiple business units and technology teams, balancing competing priorities and communicating effectively with both technical and non-technical stakeholders\n\n<!--THE END-->\n\n- Curious and comfortable challenging established ways of working with a commercial and outcome-focused approach rather than technology-led\n\n<!--THE END-->\n\n- Comfortable working in an evolving environment where AI capabilities and operating practices will continue to change.\n\n**Desirable**\n\n- An understanding of professional services, publishing, legal markets, research or other knowledge-intensive environments would be advantageous.\n\n**Role information:**\n\n- Hybrid workplace - 3 days a week in office, 2 days remote\n- This role can be based in either London or Leeds\n- Occasional travel to the other offices may be required (Bristol, London and Leeds)", "portal": "freehire-search", "seniority_classification": "\u2705 GOOD FIT", "relevance_score": 35, "filter_reason": "Compatible seniority", "hours_ago": 8.6, "posted_at": "2026-09-03T11:30:12Z"}, {"id": "ai-driven-data-engineer-for-quality-manufactu nd business stakeholders to ensure data availability, reliability, and performance.\n\nThe role is approximately 70% data engineering and 30% AI/agentic development, ideal for someone seeking growth at the intersection of data infrastructure and applied AI, including building RAG pipelines and AI", "portal": "freehire-search", "seniority_classification": "\u2705 GOOD FIT", "relevance_score": 64, "filter_reason": "Compatible seniority", "hours_ago": 8.8, "posted_at": "2026-09-03T11:15:21Z"}, {"id": "ai-data-engineer-m-w-d-highberg-sbswc3mw", "title": "AI & Data Engineer (m/w/d)", "company": "Highberg", "company_slug": "highberg", "location": "Hamburg oder Remote", "date": "2026-09-03T11:07:44Z", "url": "https://schickler.jobs.personio.com/job/2780520?utm_source=freehire.me", "work_mode": "remote", "regions": ["global"], "countries": [], "skills": ["ai", "analytics", "aws", "azure", "bigquery", "ci-cd", "cloud", "data-analytics", "data-engineering", "data-science", "data-warehousing", "dbt", "docker", "etl", "gcp", "git", "huggingface", "kubernetes", "langgraph", "llm", "looker", "looker-studio", "machine-learning", "nlp", "openai", "plotly", "powerbi", "python", "pytorch", "qdrant", "recommendation-systems", "scikit-learn", "spacy", "sql", "tableau", "terraform", "xgboost"], "description": "Bei Highberg arbeitest Du an echten Kundenproblemen, nicht an Prototypen f\u00fcr die Schublade. Du entwickelst datengetriebene L\u00f6sungen, die im operativen Alltag unserer Kunden tats\u00e4chlich eingesetzt werden und Entscheidungen beeinflussen. Du sorgst daf\u00fcr, dass diese L\u00f6sungen verstanden, akzeptiert und genutzt werden.  \nViel von der Arbeit beginnt dort, wo Anforderungen noch unklar sind. Du sch\u00e4rfst Problemstellungen, machst Daten nutzbar und entwickelst aus analytischen Ans\u00e4tzen konkrete L\u00f6sungen. Dabei arbeitest du eng mit inhaltlichen und technischen Ansprechpartnern auf Kundenseite zusammen. Typische Anwendungsfelder sind ETL-Pipelines, Data Warehouses, Recommendation Systems, Churn Prediction, Forecasting sowie NLP und LLM basierte L\u00f6sungen im Medienumfeld. Du begleitest datengetriebene L\u00f6sungen \u00fcber den gesamten Weg, von der Problemstrukturierung bis zur produktiven Umsetzung:\n\n- Du baust Datenmodelle, ETL-Prozesse und Data Warehouses in modernen Cloud-Umgebungen mit\n- Du entwickelst und bewertest ML Modelle, RAG Systeme und Agenten Workflows auf Basis realer, oft unvollst\u00e4ndiger Daten\n- Du stimmst fachliche Themen eigenst\u00e4ndig mit Kunden auf operativer Ebene ab, arbeitest dich in Anforderungen ein und findest dich auch im Kontext gro\u00dfer Kundendatenbanken sicher zurecht\n- Du bereitest analytische Ergebnisse auf und \u00fcbersetzt sie in nachvollziehbare Aussagen\n- Du \u00fcbernimmst eigenst\u00e4ndig komplexe Aufgabenstellungen und bringst diese gemeinsam mit erfahrenen Kolleginnen und Kollegen zu einer f\u00fcr den Kunden \u00fcberzeugenden L\u00f6sung.\n- Du arbeitest in Projekten mit hoher Dynamik, wechselnden Anforderungen und echten Entscheidungsabh\u00e4ngigkeiten\n\n**Unser Techstack**\n\n- Programmiersprachen & Coding-Frameworks: Python, SQL, Git, Terraform, CI/CD\n- Cloud- & Data-Tools: GCP, AWS, Azure, dbt, BigQuery, Docker, Kubernetes\n- Machine Learning, NLP & LLMs: SciKit-learn, XGBoost, spaCy, PyTorch, OpenAI, Gemini, Hugging Face, Qdrant, LangGraph, Langfuse\n- Visualisierung: Tableau, Power BI, Plotly, Looker Studio\n- Unsere Grundhaltung: Kein Tool-Dogmatismus! Im Fokus stehen pragmatische, produktionsnahe L\u00f6sungen f\u00fcr reale Kundenanforderungen\n\n**Was Dich erwartet**\n\nIn unseren Projekten hast Du direkten Einfluss auf Entscheidungen, nicht nur auf Modelle. Du arbeitest bewusst an der Schnittstelle zwischen AI-Engineering, Data Engineering und Consulting. Wer reine Notebook Projekte oder ausschlie\u00dflich technische Aufgaben sucht, wird bei uns nicht gl\u00fccklich. Dich erwartet eine breite Rolle \u00fcber Data Analytics, Data Engineering, Data Science und AI Engineering hinweg, ohne starre Trennung zwischen den Welten. Ein junges, professionelles Data Team mit kurzen Wegen, hohe Eigenverantwortung, inhaltlich breite Projekte von Data Engineering \u00fcber klassisches ML bis LLM, und ein enger Austausch mit dem Consulting-Team.\n\n- Ein mit sehr guten Noten abgeschlossenes Studium in Informatik, Mathematik, Physik, Data Science oder einer vergleichbaren Fachrichtung\n- Mind. 1 Jahr einschl\u00e4gige Berufserfahrung au\u00dferhalb von Werkstudium oder Praktikum\n- Sehr gute Python Kenntnisse\n- Praktische Erfahrung mit Cloud-Umgebungen (AWS, Azure oder GCP), Datenmodellen, ETL und Data Warehousing \u2013 mit Tiefe in mindestens einem dieser Bereiche\n- Erfahrung mit LLMs, RAG-Systemen und Agent-Workflows sowie mit g\u00e4ngigen ML-Libraries (z.B. Hugging Face, PyTorch, scikit-learn)\n- Freude an direktem Kundenkontakt und der F\u00e4higkeit, analytische Inhalte verst\u00e4ndlich zu vermitteln\n- Strukturierte Arbeitsweise und die Bereitschaft, dich in unklare Fragestellungen einzuarbeiten\n- Fester Wohnsitz in Deutschland und Reisebereitschaft innerhalb der DACH-Region f\u00fcr gelegentliche Kundentermine und mind. einen monatlichen Besuch unseres Hamburger Offices\n- Flie\u00dfende Deutschkenntnisse (mindestens C1-Level)\n\n<!--THE END-->\n\n- Flexibles Arbeiten mit gro\u00dfz\u00fcgiger Mobile-Office-Regelung\n- Zentrales, barrierearmes Office in Hamburg mit Blick auf das Rathaus\n- Moderne K\u00fcche mit Siebtr\u00e4germaschine, Tee und gek\u00fchlten Getr\u00e4nken\n- Mentoring und enge Begleitung in den ersten 12 Monaten\n- Interne und externe Weiterbildungsm\u00f6glichkeiten und ein Weiterbildungsbudget von 2000\u20ac pro Jahr\n- Deutschlandticket-Zuschuss\n- Wellpass Zuschuss\n- Dienstfahrrad-Angebot nach der Probezeit\n- Ein j\u00e4hrliches Offsite, monatliche Teamevents, gemeinsame Lunches und ein Arbeitsumfeld, in dem auch Hunde willkommen sind\n\nDu m\u00f6chtest mehr \u00fcber die Rolle, unser Team oder die Arbeitsweise bei Highberg erfahren? Ich freue mich auf den Austausch.\n\nXenia Blawazki  \nHR Business Partner  \nxenia.blawazki@highberg.com  \nLinkedIn", "portal": "freehire-search", "seniority_classification": "\u2705 GOOD FIT", "relevance_score": 82, "filter_reason": "Compatible seniority", "hours_ago": 9.0, "posted_at": "2026-09-03T11:07:44Z"}, {"id": "ai-engineer-mumbai-cashflo-talent-tclaysx6", "title": "AI Engineer : Mumbai", "company": "cashflo-talent", "company_slug": "cashflo-talent", "location": "Maharashtra, Mumbai, India", "date": "2026-09-03T11:04:49Z", "url": "https://cashflo-talent.freshteam.com/jobs/c4Zw8XSKJfae/ai-engineer-mumbai?utm_source=freehire.me", "work_mode": null, "regions": ["apac"], "countries": ["in"], "skills": ["agentic-ai", "ai", "ansible", "api", "aws", "azure", "ci-cd", "cloud", "cloud-native", "coupa", "data-engineering", "data-pipelines", "devops", "docker", "elasticsearch", "elk", "fastapi", "fine-tuning", "gcp", "generative-ai", "infrastructure-as-code", "jenkins", "kubernetes", "langchain", "langgraph", "llm", "llmops", "machine-learning", "microservices", "mlops", "observability", "postgresql", "prompt-engineering", "python", "rag", "react", "saas", "spring", "sql", "vector-databases"], "description": "# The Basics:\n\n**Team:** Engineering\n\n**Experience:** 2 to 4 years  \n**Location:** Mumbai- Andheri East **Introduction**\n\n$11 trillion of money flows every year between companies in India. It typically takes avg. 70 days for a business to get paid, and it\u2019s increasing 5% every year. Formal funding options are limited, and cover &lt; 5% of the addressable market.\n\nWe are building India\u2019s largest B2B Payments Platform that transforms how businesses pay and get paid. Our award-winning platform already processes INR 20,000+ Crores of invoices every month, across 300,000 MSMEs and 1200+ corporates; with 30+ lenders plugged in for credit.\n\nGlobally, companies in this space, like Coupa, Bill.com, Melio, C2FO, Tipalti, have witnessed tremendous success over the past decade doing $ Billion+ disbursements weekly and cumulatively valued over $50 Billion.\n\nYou will join our core team that currently consists of ex-BCG and ISB / IIM alumni with a team of industry veterans serving on the advisory board. We are backed by Elevation Capital (one of the most successful VCs in India) and General Catalyst ($15 Billion+ global fund, and early investors in Stripe, Airbnb etc.). We share our lineage with HCS, a 25 year old investment bank and a registered NBFC. We are a team of passionate problem solvers and we\u2019re building a technology company with a strong product innovation mindset.\n\nWe are looking for someone who loves a challenge, is ambitious, super tenacious and persistent. S/he is a self-starter, thrives in a dynamic, small start-up environment, has a knack for understanding customer needs, and is result-oriented. If you check these boxes - we want to talk to you!\n\n# What will a week look like in this role:\n\nWe are seeking an experienced Senior AI Engineer to join our Engineering Team.\n\nThe ideal candidate will have deep expertise in Large Language Models (LLMs), OCR, RetrievalAugmented Generation (RAG), and Agentic AI systems, coupled with strong experience in cloud-native, enterprise-scale environments. This role is pivotal in driving our AI innovation strategy, leading end-to-end solution development, and delivering production-grade AI systems.\n\n# Key Responsibilities\n\nLead the full lifecycle of Generative AI solutions \u2014 from design and development to deployment \u2014 encompassing LLM-powered workflows, RAG pipelines, OCR, and Agentic AI systems.\n\nArchitect and implement secure, scalable AI infrastructures using GCP, AWS, or Azure.\n\nApply LLMOps best practices, including fine-tuning, advanced prompt engineering, and model optimization, to maximize performance and contextual accuracy.\n\nDesign and maintain APIs and microservices (FastAPI, REST, Spring Boot) to integrate AI capabilities into enterprise systems.\n\nBuild and optimize data pipelines and manage vector databases and Elasticsearch for efficient knowledge retrieval and decision-making.\n\nImplement MLOps, CI/CD, and DevOps pipelines using Kubernetes, Docker, Jenkins, and Ansible for automated deployment and monitoring.\n\nEnsure system reliability and observability through logging, monitoring, and infrastructure-as-code practices (e.g., ELK stack).\n\nCollaborate cross-functionally with product, engineering, and business teams to align AI solutions with organizational goals.\n\nMentor and guide junior engineers, setting best practices for scalable, maintainable AI development.\n\n# Required Experience\n\n2+ years of professional software engineering experience focused on Generative AI / LLMbased applications.\n\nProven experience in developing and deploying enterprise-grade AI systems.\n\n# Qualifications\n\nDegree in Computer Science, Computer Engineering, or a related field. Demonstrated expertise in LLMs, LangChain, LangGraph, RAG architectures,\n\nOCR, and Agentic AI frameworks.\n\nAdvanced proficiency in Python and modern AI/ML development practices. Strong experience with cloud platforms (GCP, AWS, Azure).\n\nHands-on expertise in MLOps & DevOps (Kubernetes, Docker, Jenkins, Ansible, Infrastructure-as-Code).\n\nProficiency in databases and data engineering (PostgreSQL, SQL, Vector Databases).\n\nExperience with API frameworks such as FastAPI or Spring Boot.\n\nExcellent analytical, problem-solving, and communication skills, with a proven ability to lead complex AI initiatives.\n\nComfortable working across cross-functional and distributed teams. Preferred / General Requirements\n\nExperience with enterprise AI security, governance, and compliance frameworks.\n\nFamiliarity with frontend integration frameworks (e.g., ReactJS) for AI-enabled applications.\n\nA passion for innovation and staying current with emerging trends in Generative AI and Agentic systems.\n\n# Joining CashFlo - Why it\u2019s a great choice:\n\n- **Uniquely Positioned for Success:** CashFlo sits at the unique intersection of Payments, Lending, and SaaS - three of the fastest-growing and most lucrative spaces globally and in India. As a part of our team, you will be a key player in an industry-defining company.\n\n<!--THE END-->\n\n- **An Opportunity to Create Wealth:** At CashFlo, we understand that our success is deeply linked with the success of our employees. That's why we offer the potential to create exponential wealth through equity in our rapidly growing early-stage company. You will not only contribute to our growth story, but also share in the rewards.\n\n<!--THE END-->\n\n- **A Collaborative and Driven Team:** We pride ourselves on fostering a culture that encourages kindness, collaboration, and a shared commitment to quality. Our team members are always there to help each other, and we believe in lifting each other up. Your growth is our growth, and we succeed as a team.\n\n<!--THE END-->\n\n- **Direct Impact on Company Success:** At CashFlo, every role is crucial. Your work will have a real, tangible impact on our success. You'll see the results of your hard work in real-time.\n\n<!--THE END-->\n\n- **Fast-Track Your Career:** We invest in our employees' professional growth through comprehensive training programs, mentoring opportunities, and clear growth paths. Whether you aspire to grow as an individual contributor or on a management track, we provide the resources and support you need to accelerate your career.\n\n<!--THE END-->\n\n- **Best-in-class Compensation and Benefits:** We offer competitive compensation, with best-in-class incentive structures. We value the work you do, and our compensation package reflects our commitment to attracting and retaining the best talent.\n\n<!--THE END-->\n\n- **Unwavering Commitment to Excellence:** We are seeking individuals ready to dive into challenging work, individuals who are excited about going above and beyond to drive their own growth and the company's. If you are motivated by ambitious goals and are ready to make a significant impact, CashFlo is the place for you.", "portal": "freehire-search", "seniority_classification": "\ud83d\udfe1 STRETCH", "relevance_score": 86, "filter_reason": "Experience gap: 2-4 years", "hours_ago": 9.0, "posted_at": "2026-09-03T11:04:49Z"}, {"id": "ai-platform-software-engineer-drivenets-h4qd6wpz", "title": "AI Platform Software Engineer", "company": "DriveNets", "company_slug": "drivenets", "location": "Tel Aviv", "date": "2026-09-03T10:28:16Z", "url": "https://drivenets.com/job/?id=AA.B6C&utm_source=freehire.me", "work_mode": "hybrid", "regions": ["mena"], "countries": ["il"], "skills": ["agentic-ai", "ai", "ansible", "api", "autogen", "automation", "backbone", "cloud", "crewai", "distributed-systems", "embeddings", "grpc", "kubernetes", "langgraph", "llm", "mcp", "networking", "nosql", "observability", "python", "rest", "sql", "terraform", "vector-databases"], "description": "**#Hybrid**\n\nDriveNets is a leader in high-scale disaggregated networking solutions. Founded in 2015, DriveNets modernizes the way service providers, cloud providers, and hyperscalers build networks. Supporting the largest network in the world, more than half of AT&T's backbone traffic is running on DriveNets' Network Cloud open disaggregated architecture. Raising $587 million in three funding rounds, DriveNets is disrupting the networking market from high-scale architecture to AI platforms, and is bringing onboard the most talented people. We are seeking people that want to make an impact on the world's leading communication networks and are experienced in networking architecture or AI infrastructure solutions.\n\n**Job Summary**\n\nWe are looking for a talented and motivated Software Engineer with hands-on experience building and operating multi-agent AI systems in production to join our DriveNets Automation Platform (DAP) team.\n\nThe team develops automation tools, orchestration capabilities, and intelligent platforms that simplify the deployment, management, troubleshooting, and optimization of large-scale network and AI infrastructure environments.\n\nYou will work on the design and development of AI-powered systems that bridge networking, automation, observability, and distributed infrastructure \u2014 running on Kubernetes at scale. Our stack includes LangGraph, Langfuse, RAG pipelines, MCP, and agent-to-agent (A2A) communication patterns.\n\nThis role combines strong software engineering with practical AI application development, with a sharp focus on production hardening, tracing, evaluation, and safety of agentic systems \u2014 not model training or research prototypes.\n\n### Requirements\n\n- 5+ years of hands-on software engineering experience building production-grade backend services, APIs, or AI-powered systems.\n- Proven production experience with multi-agent AI systems: deployment, tracing, guardrails, hardening, and incident management.\n- Hands-on experience with agentic frameworks such as LangGraph, CrewAI, Google ADK, AutoGen, or equivalent.\n- Experience building and running evaluation pipelines for agentic solutions - including trajectory tracing, ground truth validation, and harshness/quality scoring.\n- Strong Python proficiency: comfortable building scalable backend services using gRPC and REST APIs.\n- Solid understanding of distributed systems: fault tolerance, consistency models, service communication, and operational challenges at scale.\n- Hands-on Kubernetes experience: deploying and operating containerized services, managing workloads, config, and scaling in production clusters.\n- Practical experience with embeddings, vector databases, and semantic retrieval systems in production.\n- Practical experience with RAG pipelines, LLM API integration, structured outputs, and tool calling in production environments including building and serving MCP servers at scale.\n- Working knowledge of SQL and/or NoSQL databases, schema design, and query optimization.\n- Strong debugging skills across application logic, APIs, data, and AI agent behavior.\n- Strong communication skills and a bias toward ownership and delivery.\n\nNice to Have\n\n- Familiarity with Langfuse/Arize Pheonix.\n- Familarity with A2A & A2UI protocols.\n- Experience with network automation, orchestration, or configuration management (Ansible, Terraform, NETCONF, gNMI, or similar).\n\nDriveNets is on a mission to build a special company comprised of individuals with diverse backgrounds, perspectives, and experiences.\n\nDriveNets is an equal opportunity employer. We do not discriminate based on upon race, religion, national origin, sexual orientation, gender identity, gender expression, age, status as a protected veteran, status as an individual with disability, or other applicable legally protected characteristics.", "portal": "freehire-search", "seniority_classification": "\u2705 GOOD FIT", "relevance_score": 39, "filter_reason": "Compatible seniority", "hours_ago": 9.6, "posted_at": "2026-09-03T10:28:16Z"}, {"id": "ai-engineer-deloitte-dvcoevkt", "title": "AI Engineer", "company": "Deloitte", "company_slug": "deloitte", "location": "Haifa, North District", "date": "2026-09-03T10:18:51Z", "url": "https://careers.deloitte.co.il/position/81-551-en/?+Applicants+%257C+March+2026+=&-ai-engineer_haifa=&hsa_acc=505595090&hsa_ad=1496550913&hsa_cam=904724923&hsa_grp=881460693&hsa_net=linkedin&hsa_ver=3&li_fat_id=99dc6309-ae96-41b8-a3e9-9d57fe00ba4c&utm_id=904724923&utm_source=freehire.me", "work_mode": "hybrid", "regions": ["mena"], "countries": ["il"], "skills": ["agentic-ai", "agile", "ai", "cuda", "deep-learning", "generative-ai", "git", "llm", "microservices", "nim", "prototyping", "python", "react", "redis", "scrum", "sql", "tdd", "tensorrt", "transformers", "triton", "typescript"], "description": "**About Us**\n\nWe are an NVIDIA partner, delivering professional services in **advanced software development**, artificial intelligence systems, and high-performance AI solutions. We build production-grade AI systems optimized for NVIDIA GPU platforms, working across multiple applied AI domains, including **Generative AI / Agentic Systems.**\n\n**Role Overview**\n\n**We are looking for an experienced AI Software Engineer** to take a leading role in designing, building, and delivering advanced AI systems for real-world applications. This role is suited for a hands-on engineer with **strong software engineering** **skills** and deep experience in applied AI, who enjoys solving complex problems, owning technical solutions end-to-end, and mentoring junior team members.\n\nProjects typically focus on LLM or Multimodal LLM based agentic systems.\n\n**What We Work On**\n\n**Our work spans software engineering and AI domains:**\n\n- Design and implementation of agentic systems powered by Large Language Models (LLMs)\n- Deployment of open-source LLMs on NVIDIA GPUs\n- High-performance inference using NVIDIA technologies such as NVIDIA NIM (Inference Microservices)\n- System-level design for reliability, scalability, and performance\n- Multimodal agents for text, image, audio, and video processing\n- Performance optimization on GPU platforms\n\n**Key Responsibilities**\n\n- Lead the design and development of LLM-based agentic systems.\n- Own end-to-end delivery of AI solutions, from architecture and prototyping to production deployment using rigorous software engineering practices\n- Optimize model performance, latency, and throughput on NVIDIA GPU platforms\n- Design clean, maintainable, and scalable software architectures\n- Collaborate with customers, product teams, and engineers to translate requirements into technical solutions\n- Mentor junior engineers and contribute to technical best practices\n- Evaluate new tools, AI models, and frameworks and drive their adoption when appropriate\n\n### Requirements\n\n- BSc or MSc in Computer Science, Electrical Engineering, or a related field\n- 4+ years of experience in software engineering and applied AI (or equivalent)\n- Strong knowledge of software design and development practices\n- Strong proficiency in Python and modern AI frameworks\n- Proven experience delivering production-grade AI systems\n- Solid understanding of deep learning architectures (CNNs, transformers)\n- Experience with system-level design, debugging, and performance optimization\n- Experience working with Large Language Models (LLMs)\n- Building agentic workflows, reasoning systems, or AI-driven applications\n- Deploying and optimizing open-source LLMs for inference\n\n**Nice to Have**\n\n- Experience with NVIDIA technologies (CUDA, TensorRT, Triton, NVIDIA NIM)\n- Experience with GPU performance profiling and optimization\n- Background in high-performance or low-latency systems\n- Experience with Multimodal LLM agents for text, image, audio, and video processing\n- Experience with React, TypeScript, Redis Pub/Sub, SQL, Containerized Development\n- Experience with Test-Driven Development, Agile Scrum methodology, Git workflows\n- Experience mentoring engineers or leading technical initiatives\n\n**What We Offer**\n\n- Ownership of complex, high-impact AI projects\n- Work with cutting-edge NVIDIA GPU and AI technologies\n- Influence over architecture, tooling, and technical direction\n- A collaborative, engineering-driven culture\n- Opportunities for technical leadership and professional growth\n- Real-world, production-scale AI challenges\n\n**Full time Job**\n\n**Location: Haifa, Hybrid**\n\nWe at Deloitte believe that diversity and inclusion among our people is a critical component of our success and that is why we cultivate an organizational culture that contains and embraces diversity in all its forms.\n\n### Description Hebrew\n\n\u05d9\u05d5\u05e2\u05e5 \u05d1\u05db\u05d9\u05e8 \u05dc\u05d0\u05d5\u05e4\u05d8\u05d9\u05de\u05d9\u05d9\u05d6\u05e8\n\n### Re ools, and internal servers.\n- Identify high-impact manual processes and turn them into automated AI-driven business wins.\n- Evaluate new AI tools, frameworks, and agentic workflows, and apply them where they can improve productivity, decision-making, or business operations.\n- Help shape internal AI development best practices around reliability, usability, security, documentation, maintainability, and production readiness.\n\n### Requirements\n\n- 3 + years of hands-on experience in AI Engineering, Data Engineering, Software Engineering, Data Science, Analytics Engineering, or a similar technical role.\n- Proven experience demonstrating strong business acumen, ownership, and communication skills, with the ability to work independently with stakeholders and drive projects from idea to production.\n- Proven customer-facing and internal-facing experience, with the ability to effectively collaborate, communicate, and build strong relationships with both customers and cross-functional stakeholders.\n- Proven experience building and deploying AI-powered products, workflows, agents, automations, or business solutions in a real company environment.\n- Strong hands-on experience with LLMs, AI agents, prompt engineering, RAG, workflow automation, APIs, or AI development frameworks.\n- Ability to code and build practical solutions using Python, SQL, JavaScript/TypeScript, or similar languages.\n- Strong data experience, including ETLs, data pipelines, APIs, databases, data warehouses, and Snowflake.\n- Experience working in a SaaS or B2B technology company.\n- Degree in Engineering, Computer Science, Mathematics, Statistics, Physics, or a related quantitative field - advantage\n\n**\ufeffAdvantages**\n\n- Experience with agent frameworks, RAG systems, vector databases, orchestration tools, Snowflake, Airflow, Rivery, Gitlab, Claude, OpenAI, or similar tools.\n- Experience working in a cybersecurity or data company.", "portal": "freehire-search", "seniority_classification": " ts.\n- Support implementation and adoption of solutions across the business.\n\n**Software & Product Development**\n\n- Build and enhance AI-driven internal applications and customer-facing solutions.\n- Participate throughout the development lifecycle, from initial concept and prototyping through development and deployment.\n- Translate ideas and business requirements into functional software products.\n- Continuously improve existing tools based on user feedback and business needs.\n- Take ownership of the solutions developed and their performance in production.\n\n### Technical Environment\n\n**Core Technologies**\n\n- TypeScript / JavaScript\n- Node.js\n- PostgreSQL\n- REST APIs and API development\n- React / Next.js\n\n**Additional / Advantageous Skills**\n\n- Python\n- Docker and containerization\n- GraphQL\n- C#\n- Modern web application frameworks\n\n### AI & Development Approach\n\nAI tools are an important part of the development environment, but they are used as productivity enhancers rather than replacements for engineering judgement.\n\nYou should be comfortable working with AI-assisted development while maintaining responsibility for the quality, security, reliability, and functionality of anything you deliver.\n\nThe ability to assess AI-generated output, test solutions thoroughly, identify limitations, and make sound technical decisions is essential.\n\nExperience with **LLM APIs such as OpenAI or Claude, embeddings, AI workflows, or similar technologies** will be highly advantageous.\n\n**Education & Experience**\n\n- Degree in Computer Science or a closely related discipline at undergraduate or master's level.\n- Suitable for graduate-level candidates, preferable with around **1-2 years of commercial software development experience**.\n- Strong foundation in modern full-stack development.\n\n**Technical Skills**\n\n- Good working knowledge of React, TypeScript, Node.js, and PostgreSQL.\n- Experience designing, integrating, and working with APIs.\n- Familiarity with REST and/or GraphQL.\n- Understanding of current AI technologies and their practical business applications.\n- Exposure to LLM-based applications, embeddings, or AI automation is highly desirable.\n- Knowledge of Python, Docker, or other modern development technologies is an advantage.\n\n### Personal Attributes\n\nWe are looking for someone who:\n\n- Takes initiative and actively identifies opportunities to improve processes.\n- Enjoys solving practical problems rather than simply completing assigned tasks.\n- Can communicate effectively with both technical and non-technical stakeholders.\n- Is comfortable working within a global and distributed team environment.\n- Can adapt quickly to new technologies and development tools.\n- Is pragmatic and open-minded when selecting technologies and approaches.\n- Uses AI effectively while maintaining ownership and accountability for the final result.\n- Is willing to learn and work across different technologies when required.\n\n### What We Value\n\nA **problem-first and technology-flexible mindset** is important for this position. You should be comfortable learning new frameworks, tools, and technologies rather than being restricted to one particular development stack.\n\n### Industry Knowledge\n\nPrevious experience in the maritime sector is **not required**.\n\nFull industry and business context will be provided, with access to experienced domain specialists to support your understanding of the business.\n\nCapt. Jacky Chan\n\n07C3069\n\nR1110620", "portal": "freehire-search", "seniority_classification": "\ud83d\udd25 HIGH PRIORITY", "relevance_score": 43, "filter_reason": "Perfect entry-level match", "hours_ago": 10.3, "posted_at": "2026-09-03T09:47:45Z"}, {"id": "ai-full-stack-engineer-chronoai-gcztbkda", "title": "AI Full-Stack Engineer", "company": "chronoai", "company_slug": "chronoai", "location": "Singapore", "date": "2026-09-03T09:47:44Z", "url": "https://en-sg.whatjobs.com/pub_api__cpl__89975575 San Francisco, CA", "date": "2026-09-02T23:46:44Z", "url": "https://app.careerpuck.com/job-board/lyft/job/8639200002?gh_jid=8639200002&utm_source=freehire.me", "work_mode": "hybrid", "regions": ["north_america"], "countries": ["us"], "skills": ["airflow", "aws", "data-pipelines", "data-science", "kubernetes", "machine-learning", "proof-of-concept", "python", "spark"], "description": "At Lyft, our purpose is to serve and connect. We aim to achieve this by cultivating a work environment where all team members belong and have the opportunity to thrive.\n\nWe are hiring a Machine Learning Engineer to join our ETA team. Our team builds and maintains Lyft's system responsible for estimating/predicting ETAs for every ride request on our platform. ETAs play a critical role in matching decisions, pricing estimates and overall user experience. Low latency, high reliability and high accuracy are paramount for our success.\n\nIf you are a critical thinker with experience in machine learning workflows and writing reliable code, passionate about solving business problems using data and working in a dynamic, creative, and collaborative environment, we are searching for you.\n\nOur technology stack runs on AWS, Kubernetes, Go, Spark, Python and Apache Airflow. In this role, you will work with incredibly passionate and talented colleagues from software engineering, machine learning and data science on building rideshare experiences that delight millions of riders and drivers.\n\n## **Responsibilities:**\n\n- Perform data analysis and build proof-of-concept to explore and compare ML and non-ML solutions\n- Be able to make effective tradeoffs between model accuracy, its productization complexity and runtime performance\n- Develop statistical, machine learning, or optimization models\n- Write production quality code that can scale well to serve millions of requests per day\n- Participate in code reviews, design reviews, production on-call support and incident triaging process.\n- Write are more information about the various in-office perks Lyft offers. Additionally, hybrid roles have the flexibility to work from anywhere for up to 4 weeks per year. #Hybrid\n\nThe expected base pay range for this position in the San Francisco area is $140,800 - $176,000, not inclusive of potential equity offering, bonus or benefits. Salary ranges are dependent on a variety of factors, including qualifications, experience and geographic location. Your recruiter can share more information about the salary range specific to your working location and other factors during the hiring process.", "portal": "freehire-search", "seniority_classification": "\u2705 GOOD FIT", "relevance_score": 39, "filter_reason": "Compatible seniority", "hours_ago": 20.3, "posted_at": "2026-09-02T23:46:44Z"}, {"id": "ml-engineer-data-driven-ad-analytics-ml-ops-future-impact-d53rkeid", "title": "ML Engineer: Data-Driven Ad Analytics & ML Ops", "company": "Future Impact", "company_slug": "future-impact", "location": "Netherlands", "date": "2026-09-02T23:02:24Z", "url": "https://nl.whatjobs.com/pub_api__cpl__156981121__7137?utm_campaign=publisher&utm_medium=api&utm_source=freehire.me", "work_mode": null, "regions": ["eu"], "countries": ["nl"], "skills": ["agile", "aws", "databricks", "etl", "machine-learning", "mlops", "pyspark", "python", "scala", "spark"], "description": "DPG Media zoekt een machine learning engineer die deel uitmaakt van het AdData-team en data-gedreven oplossingen bouwt voor advertenties in Belgi\u00eb en Nederland.\n\nBekijk het functieoverzicht hieronder. Als u ervan overtuigd bent dat u over de juiste vaardigheden en ervaring beschikt, solliciteer dan vandaag nog.\n\nJe combineert data uit diverse bronnen tot modellen die campagneprestaties verhogen en inzichten leveren aan klanten.\n\nJe werkt in een Agile-team van 10 FTE met AWS-stack, Spark, Databricks, PySpark, Python, Scala en ML-tools. xgiwjmb\n\nVerantwoordelijk voor ETL/MLops, modelmonitoring en continue verbetering van dataflows en modellen.", "portal": "freehire-search", "seniority_classification": "\u2705 GOOD FIT", "relevance_score": 68, "filter_reason": "Compatible seniority", "hours_ago": 21.0, "posted_at": "2026-09-02T23:02:24Z"}, {"id": "ml-engineer-applied-ai-crucible-firestorm-zsy7spge", "title": "ML Engineer, Applied AI \u2013 Crucible", "company": "Firestorm", "company_slug": "firestorm", "location": "San Diego, USA", "date": "2026-09-02T22:29:02Z", "url": "https://jobs.gem.com/firestorm/am9icG9zdDpHRS8HqNj5ilKgAASueTNB?utm_source=freehire.me", "work_mode": null, "regions": ["north_america"], "countries": ["us"], "skills": ["ai", "api", "cloud", "data-science", "fine-tuning", "itar", "llm", "machine-learning", "python"], "description": "## **Who We Are**\n\nAt Firestorm, we are building the future of expeditionary defense manufacturing and autonomous systems. Modern conflict has exposed a fundamental problem: the systems needed most by operators are often too expensive, too slow to produce, and too difficult to sustain at scale. Firestorm exists to change that.\n\nWe develop mission-adaptable aerial systems and deployable manufacturing infrastructure designed to put capability directly into the hands of the warfighter. From modular unmanned aircraft to xCell \u2014 our deployable microfactory \u2014 our goal is to make defense systems rapidly deployable, adaptable, and producible at the point of need.\n\nWe are looking for builders, operators, and problem-solvers who want to work on meaningful technology with real-world impact.\n\n## **About the Role**\n\nFirestorm builds uncrewed aircraft and the manufacturing network that produces them: full-capability plants, deployable xCell edge factories, and forward-deployed sites that stand up production near the point of need.\n\nCrucible is the software that runs that network. It combines production planning, execution, supply chain, and manufacturing data into a common model of how production operates.\n\nWe are hiring a Staff Machine Learning Engineer to build the applied AI systems behind Crucible. You will work alongside data science and software engineering to productionize optimization and ML models, integrate foundation models into the platform, and build AI-assisted workflows grounded in Crucible's manufacturing data and system model.\n\nThis is a hands-on engineering role, not a research position. We are looking for someone who has shipped ML and AI capabilities into real products and understands what it takes to make them reliable, measurable, and useful after the prototype works.\n\n## **What You\u2019ll Do**\n\n- **Build AI capabilities in Crucible** \u2014 Develop AI-assisted workflows that use Crucible's data, APIs, and domain model to surface insights, answer questions, and help users make decisions.\n- **Productionize decision models** \u2014 Work with data science to integrate optimization, forecasting, and other models into reliable product capabilities.\n- **Build AI systems end-to-end** \u2014 Design model interfaces, retrieval, tool use, orchestration, evaluation, and the services required to run them in production.\n- **Select and evaluate models** \u2014 Choose models and approaches based on capability, reliability, latency, security, and deployment constraints.\n- **Build for constrained environments** \u2014 Support AI capabilities in cloud, air-gapped, and edge deployments where external model APIs may not be available.\n- **Ground AI in real operations** \u2014 Work with manufacturing, supply chain, and product teams to turn operational problems into useful AI features.\n- **Set the technical direction for applied AI** \u2014 Establish patterns, evaluation methods, and engineering standards for how AI is used across Crucible.\n\n## **Required Qualifications**\n\n- U.S. Citizenship and ability to obtain and maintain a U.S. Government security clearance\n- 5+ years building and shipping production software or ML systems, with a proven track record of success\n- Strong machine learning fundamentals, with hands-on experience beyond model API integration\n- Demonstrated technical ownership of AI/ML systems from experimentation through production, including implementation, architecture, evaluation, and debugging\n- Hands-on experience building production systems with LLMs or other foundation models\n- Strong Python and software engineering fundamentals\n- Experience with modern ML frameworks and transformer-based models\n- Experience designing evaluations and monitoring production AI/ML behavior\n- Demonstrated ability to make sound technical tradeoffs across model quality, reliability, latency, cost, and system complexity\n\n## **Preferred Qualifications**\n\n- Experience working with open-source models and local model inference\n- Experience with manufacturing, supply chain, logistics, or other operational software\n- Experience with model fine-tuning, inference optimization, or GPU deployment\n- Aerospace, defense, robotics, or other complex physical-system experience\n\n## **Work Environment**\n\n- This role is based in San Diego, CA.\n- We welcome candidates who are local or open to relocating; relocation assistance is available and may be included in the offer package where appropriate.\n\n## **Compensation**\n\nUS Salary Range: $150,000 \u2013 $220,000 USD\n\n*The posted salary range reflects an estimate based on a variety of compensation factors, including but not limited to relevant experience, education, certifications, specialized skills, geographic location, and business needs. Actual compensation may vary, and this range is subject to change as our compensation structure or market conditions evolve.*\n\n## **Benefits & Perks**\n\nOur culture fosters collaboration, respect, and trust, empowering passionate people to do their best work. We offer a competitive salary, comprehensive benefits, and opportunities for career growth. In addition to an opportunity to take part in an innovative, collaborative and fast-growing business with a highly motivated and skilled team, we also take pride in taking care of our employees. Here are just a few ways that we show our appreciation:\n\n- We offer comprehensive medical, dental, and visions plans\n- 401(k) Retirement Savings Plan to invest in your long-term retirement goals\n- Equity grants for new hires\n- Unlimited PTO\n- Extremely generous company holiday calendar, including a holiday hiatus in July & December.\n- Generous Parental Leave\n- Lifestyle Spending Account\n- FSA\n- DCFSA\n- HSA\n- Hospital Indemnity insurance\n- Critical Illness insurance\n- Accident insurance\n- Basic Life/AD&D, short-term and long-term disability insurance, 100% covered by Firestorm. Plus, the option to purchase additional life insurance for you and your family.\n- Mental Health Resources: We provide free mental health resources 24/7 including therapy and more. Additional work-life services, such as free legal and financial support, are available to you as well.\n\n## **Export Control Compliance**\n\nTo conform to U.S. government export control regulations, including the International Traffic in Arms Regulations (ITAR) and Export Administration Regulations (EAR), you must be a U.S. citizen, lawful permanent resident of the U.S., protected individual as defined by 8 U.S.C. 1324b(a)(3), or otherwise eligible to obtain the required authorizations from the U.S. Department of State or U.S. Department of Commerce.\n\n## **Equal Opportunity Statement**\n\nFirestorm is an equal opportunity employer, committed to creating a diverse and inclusive workplace, and upholding equitable hiring practices. All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, disability, protected veteran status, or any other characteristic under federal, state, or local law, including those with a criminal history, in a manner consistent with the requirements of applicable state and local laws, including the CA Fair Chance Initiative for Hiring Ordinance. We actively encourage members of recognized minorities, women, Veterans, and those with disabilities to apply, and we work to create a welcoming and supportive environment for all applicants throughout the interview process.\n\nFirestorm is committed to fostering an inclusive and accessible work environment. If you require accommodations or assistance during the application process, please don\u2019t hesitate to reach out to us at careers@launchfirestorm.com so we can provide the support you need.", "portal": "freehire-search", "seniority_classification": "\u2705 GOOD FIT", "relevance_score": 64, "filter_reason": "Compatible seniority", "hours_ago": 21.6, "posted_at": "2026-09-02T22:29:02Z"}, {"id": "ml-models-implementation-performance-optimization-intern-oct-2026-start-tenstorrent-swevtcgk", "title": "ML Models Implementation & Performance Optimization, Intern (Oct 2026 start)", "company": "Tenstorrent", "company_slug": "tenstorrent", "location": "Belgrade, Serbia", "date": "2026-09-02T21:54:05Z", "url": "https://job-boards.greenhouse.io/tenstorrentuniversity/jobs/5082990007?utm_source=freehire.me", "work_mode": null, "regions": ["eu"], "countries": ["rs"], "skills": ["ai", "cpp", "machine-learning", "networking", "python", "pytorch"], "description": "Tenstorrent is leading the industry on cutting-edge AI technology, revolutionizing performance expectations, ease of use, and cost efficiency. With AI redefining the computing paradigm, solutions must evolve to unify innovations in software models, compilers, platforms, networking, and semiconductors. Our diverse team of technologists have developed a high performance RISC-V CPU from scratch, and share a passion for AI and a deep desire to build the best AI platform possible. We value collaboration, curiosity, and a commitment to solving hard problems. We are growing our team and looking for contributors of all seniorities.\n\nAt Te mented models and iterate on improvements.\n- Contribute to performance optimization efforts where success is measured by achieving both high accuracy and fast execution (inference) of ML models on Tenstorrent hardware.\n\n**What You Will Learn**\n\n- How to implement state-of-the-art ML models on Tenstorrent hardware using Python, C++, and popular ML frameworks like PyTorch.\n- Techniques for benchmarking, analyzing, and optimizing the performance of ML model inference using existing tools and code in C++ and Python.\n- How to use (and potentially debug and fix) Tenstorrent\u2019s open-source software libraries, such as tt-metalium, tt-nn, and tt-llk.\n- How to collaborate with experienced engineers, apply various problem-solving techniques, and drive a well-defined engineering project under the guidance of a dedicated mentor.\n\n*Tenstorrent offers a highly competitive compensation package and benefits, and we are an equal opportunity employer.*\n\n*This offer of employment is contingent upon the applicant being eligible to access U.S. export-controlled technology. Due to U.S. export laws, including those codified in the U.S. Export Administration Regulations (EAR), the Company is required to ensure compliance with these laws when transferring technology to nationals of certain countries (such as EAR Country Groups D:1, E1, and E2). These requirements apply to persons located in the U.S. and all countries outside the U.S. As the position offered will have direct and/or indirect access to information, systems, or technologies subject to these laws, the offer may be contingent upon your citizenship/permanent residency status or ability to obtain prior license approval from the U.S. Commerce Department or applicable federal agency. If employment is not possible due to U.S. export laws, any offer of employment will be rescinded.*", "portal": "freehire-search", "seniority_classification": "\u2705 GOOD FIT", "relevance_score": 35, "filter_reason": "Compatible seniority", "hours_ago": 22.2, "posted_at": "2026-09-02T21:54:05Z"}, {"id": "ml-systems-engineer-final-wq3cz4ia", "title": "ML Systems Engineer", "company": "Final", "company_slug": "final", "location": "Ramat Hasharon", "date": "2026-09-02T19:52:33Z", "url": "https://www.final.co.il/career/?utm_source=freehire.me", "work_mode": "hybrid", "regions": ["mena"], "countries": ["il"], "skills": ["agile", "cpp", "cuda", "deep-learning", "distributed-training", "machine-learning", "python", "pytorch", "quantization", "tensorflow", "triton"], "description": "Final is a world leader in trading algorithms and trade execution technologies development. Our multi-disciplinary teams have built a unique and highly successful machine-learning\u2013based HFT platform that consistently delivers exceptional results. In a world increasingly dominated by learning machines and artificial intelligence, we at Final are especially proud of our humans. Our elite team of exceptional individuals is the soul of our company, and we prioritize providing them with a professionally fulfilling environment that supports a healthy work\u2013life balance.\n\nWe encourage our employees to pursue their passions outside of work and are proud to offer a variety of opportunities, resources, and an agile environment that promotes their well-being.\n\nWe are looking for a **Software Engineer specializing in ML Systems Engineering** to join Final\u2019s Development department.\n\nWhile vision and language models have become increasingly commoditized, Final\u2019s proprietary deep learning models are unique, fast-evolving, and deployed in live trading across the world\u2019s most efficient and sophisticated financial markets. Operating in this environment presents distinct scaling challenges and continuous opportunities for optimization. Success in this role requires first-principles thinking and a deep understanding of the engineering trade-offs behind high-performance DL systems.\n\nThis is a pivotal role within Final\u2019s engineering organization. You will work closely with researchers and engineers across the company, running deep learning models on massive compute clusters and adapting them for production serving under strict and non-trivial constraints.\n\n### Requirements\n\n\u00b7 B.Sc. with honors in CS/EE/Math/Physics, or a related field from a top-tier university\n\n\u00b7 5+ years of hands-on experience building and deploying large-scale deep learning systems in production\n\n\u00b7 Advanced proficiency in PyTorch/TensorFlow\n\n**Preferred Qualifications :**\n\n\u00b7 M.Sc. or Ph.D. in a relevant quantitative field - Advantage\n\n\u00b7 Proficiency in Python/C/C++\n\n\u00b7 Deep, working knowledge of PyTorch internals\n\n**Strong experience in several of the following areas:**\n\n\u00b7 Performance profiling and optimization of deep learning workloads\n\n\u00b7 Orchestrating and optimizing large-scale distributed training (hundreds to thousands of GPUs)\n\n\u00b7 Optimizing model serving and inference pipelines (quantization, distillation, compilation, memory optimization, etc.)\n\n\u00b7 Training and scaling state-of-the-art vision, language, or diffusion models\n\n\u00b7 Implementing custom CUDA/Triton kernels", "portal": "freehire-search", "seniority_classification": "\u2705 GOOD FIT", "relevance_score": 39, "filter_reason": "Compatible seniority", "hours_ago": 24.2, "posted_at": "2026-09-02T19:52:33Z"}, {"id": "ml-engineer-foundation-model-infrastructure-waymo-rlzmzu7x", "title": "ML Engineer, Foundation Model Infrastructure", "company": "waymo", "company_slug": "waymo", "location": "Mountain View, CA, USA; San Francisco, CA, USA; Kirkland, WA, USA; New York, NY, USA", "date": "2026-09-02T19:45:01Z", "url": "https://careers.withwaymo.com/jobs?gh_jid=8107088&utm_source=freehire.me", "work_mode": "hybrid", "regions": ["north_america"], "countries": ["us"], "skills": ["ai", "ci-cd", "cpp", "data-pipelines", "deep-learning", "distributed-systems", "jax", "kubeflow", "machine-learning", "mlops", "python", "pytorch", "reinforcement-learning", "spark", "tensorflow"], "description": "Waymo is an autonomous driving technology company with the mission to be the world's most trusted driver. Since its start as the Google Self-Driving Car Project in 2009, Waymo has focused on building the Waymo Driver\u2014The World's Most Experienced Driver\u2122\u2014to improve access to mobility while saving thousands of lives now lost to traffic crashes. The Waymo Driver powers Waymo\u2019s fully autonomous ride-hail service and can also be applied to a range of vehicle platforms and product use cases. The Waymo Driver has provided over ten million rider-only trips, enabled by its experience autonomously driving over 100 million miles on public roads and tens of billions in simulation across 15+ U.S. states.\n\nThe mission of the Waymo AI Foundations team is to develop machine learning solutions addressing open problems in autonomous driving, towards the goal of safely operating Waymo vehicles in dozens of cities and under all driving conditions. As part of our work, we also initiate and foster collaborations with other research teams in Alphabet. AI Foundations areas that we are currently focusing on include reinforcement learning, learning from demonstration, generative modeling, Bayesian inference, hierarchical learning, and robust evaluation.\n\nIn this hybrid role, you will report to a Senior Research Scientist.\n\n**You will:**\n\n- Build and operate the petabyte-scale data systems and ML pipelines at the heart of Waymo's foundation model development\n- Shepherd cutting-edge foundation models from research prototypes to robust components within the Waymo Driver\n- Create the automated infrastructure for rigorously benchmarking, continuously monitoring, and safely releasing models\n- Wield large-scale compute and frameworks like Flume and JAX to process massive datasets and train/deploy complex models\n- Drive significant leaps in the speed, reliability, and efficiency of the end-to-end ML development lifecycle\n- Partner with AI Foundations, ML, and Platform experts to transform model innovations into tangible on-road improvements\n\n**You have:**\n\n- Masters degree in Computer Science, Machine Learning, Robotics, similar technical field of study, or equivalent practical experience\n- Proficiency in Python\n- Proficiency in C++\n- Familiarity with one of the modern deep learning frameworks (e.g. Pytorch, JAX, Tensorflow)\n- Experience building or maintaining large-scale data pipelines or ML infrastructure (e.g., Flume, Spark, Borg, Kubeflow)\n\n**We prefer:**\n\n- Strong hands-on SWE skills, able to drive development of large, complex shared codebases\n- Experience in AV planning and related research\n- Experience designing and building distributed systems or MLOps platforms (e.g., model versioning, experiment tracking, CI/CD for ML)\n- Prior work in an industrial or research setting developing methodologies for the evaluation of ML models\n\nIn accordance with Washington state law, we are highlighting our comprehensive benefits package, which is available to all eligible US based employees. Benefits for this role include:\n\n*Health, dental, vision, life, disability insuranceRetirement Benefits: 401(k) with company matchPaid Time Off: 20 days of vacation per year, accruing at a rate of 6.15 hours per pay period for the first five years of employmentSick Time: 40 hours/year (statutory, where applicable); 5 days/event (discretionary)Maternity Leave (Short-Term Disability + Baby Bonding): 28-30 weeksBaby Bonding Leave: 18 weeksHolidays: 13 paid days per year*\n\nThe expected base salary range for this full-time position across US locations is listed below. Actual starting pay will be based on job-related factors, including exact work location, experience, relevant training and education, and skill level. Your recruiter can share more about the specific salary range for the role location or, if the role can tirement Benefits: 401(k) with company matchPaid Time Off: 20 days of vacation per year, accruing at a rate of 6.15 hours per pay period for the first five years of employmentSick Time: 40 hours/year (statutory, where applicable); 5 days/event (discretionary)Maternity Leave (Short-Term Disability + Baby Bonding): 28-30 weeksBaby Bonding Leave: 18 weeksHolidays: 13 paid days per year*\n\nThe expected base salary range for this full-time position across US locations is listed below. Actual starting pay will be based on job-related factors, including exact work location, experience, relevant training and education, and skill level. Your recruiter can share more about the specific salary range for the role location or, if the role can be performed remote, the specific salary range for your preferred location, during the hiring process.\n\nWaymo employees are also eligible to participate in Waymo\u2019s discretionary annual bonus program, equity incentive plan, and generous Company benefits program, subject to eligibility requirements.\n\nSalary Range\n\n$175,000\u2014$215,000 USD", "portal": "freehire-search", "seniority_classification": "\u2705 GOOD FIT", "relevance_score": 60, "filter_reason": "Compatible seniority", "hours_ago": 24.3, "posted_at": "2026-09-02T19:45:01Z"}, {"id": "ml-engineer-trainee-qbrainx-ihxivuwn", "title": "ML Engineer - Trainee", "company": "QBrainX", "company_slug": "qbrainx", "location": "Coimbatore South, India", "date": "2026-09-02T18:44:25Z", "url": "https://qbrainx.zohorecruit.com/jobs/Careers/625705000012295001?utm_source=freehire.me", "work_mode": null, "regions": ["apac"], "countries": ["in"], "skills": ["aws", "azure", "cloud", "data-science", "feature-engineering", "gcp", "git", "machine-learning", "model-evaluation", "numpy", "pandas", "python", "pytorch", "scikit-learn", "statistics", "tensorflow", "version-control"], "description": "We are looking for a passionate and self-motivated **Machine Learning Engineer - Trainee** to join our team. As a trainee, you will work closely with data scientists and senior ML engineers to build, train, and deploy machine learning models that solve real-world problems.\n\n### Requirements\n\n### **Requirements**\n\n- Strong understanding of **machine learning algorithms**, statistics, and data structures.\n- Proficiency in **Python** and popular ML libraries such as **scikit-learn, pandas, NumPy, TensorFlow or PyTorch**.\n- Familiarity with **data preprocessing, feature engineering, and model evaluation techniques**.\n- Good understanding of **supervised and unsupervised learning techniques**.\n- Knowledge of **version control systems (e.g., Git)** and basic software engineering principles.\n- Exposure to cloud platforms (AWS, GCP, Azure) is a plus.\n- Strong analytical, problem-solving, and communication skills.\n- Bachelor\u2019s degree in Computer Science, Data Science, or a related field (final-year students or recent graduates can apply).", "portal": "freehire-search", "seniority_classification": "\ud83d\udd25 HIGH PRIORITY", "relevance_score": 64, "filter_reason": "Explicitly entry-level", "hours_ago": 25.3, "posted_at": "2026-09-02T18:44:25Z"}, {"id": "ml-quantitative-researcher-nazvanie-skryto-fintech-qf542azz", "title": "ML Quantitative Researcher", "company": "\u041d\u0430\u0437\u0432\u0430\u043d\u0438\u0435 \u0441\u043a\u0440\u044b\u0442\u043e (Fintech)", "company_slug": "nazvanie-skryto-fintech", "location": "Worldwide", "date": "2026-09-02T14:59:52Z", "url": "https://getmatch.ru/vacancies/35164-ml-quantitative-researcher?utm_source=freehire.me", "work_mode": "remote", "regions": ["global"], "countries": [], "skills": ["api", "data-pipelines", "deep-learning", "feature-engineering", "machine-learning", "neural-networks", "pandas", "python", "statistics", "time-series", "transformers"], "description": "We're looking for people with a strong ML background to work across Quant Research and Feature Engineering. No finance experience required - we'll teach you everything, from market microstructure to portfolio construction. We care about how you think and your ability to ask the right questions of data.\n\n## What you'll be doing:\n\n- Formulate and test hypotheses about market inefficiencies - and stay honest when the backtest says no.\n- Think ahead about how model predictions will be integrated into trading - directional bets, spread convergence, or something else.\n- Design features with genuine predictive power, from classical statistical transformations to learned representations. Every feature is a hypothesis about the market encoded in a number, and you own the quality of that input.\n- Work with alternative data, time series, and nonlinear dependencies to find signal in places others overlook.\n- Build data pipelines that work reliably in production, not just in a notebook.\n\n## What we're looking for:\n\n- Deep ML understanding, not just knowing the APIs, but having a clear sense of why gradient boosting tends to outperform transformers on tabular data, when a Bayesian approach beats a frequentist one, and what information leakage looks like in a time series context.\n- Proven hands-on experience with both deep learning and gradient boosting frameworks \u2013 a strong conceptual understanding of neural network internals is essential.\n- Serious attention to data leakage. In finance, the future bleeds into the past in non-obvious ways, and you need to spot these issues before they invalidate a backtest.\n- Solid math background: statistics, probability theory, stochastic processes.\n- Solid Python skills. Experience with pandas, Polars, or streaming data processing is a plus.\n- A statistical mindset: you don't just apply methods, you understand their assumptions, limitations, and failure modes.\n- Professional English proficiency at B2-level or above.\n\n*Nice to have:*\n\n- Graduate of SHAD or a similar top-tier technical or quantitative program.\n- Background in competitive mathematics, physics, or c         const bucketColors = {
            "3h": "var(--color-3h)",
            "5h": "var(--color-5h)",
            "8h": "var(--color-8h)",
            "12h": "var(--color-12h)",
            "24h": "var(--color-24h)",
            "1d": "var(--color-1d)",
            "7d": "var(--color-7d)"
        };

        function formatDate(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('en-US', {
                month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
        }

        function getBucket(hours) {
            if (hours <= 3) return "3h";
            if (hours <= 5) return "5h";
            if (hours <= 8) return "8h";
            if (hours <= 12) return "12h";
            if (hours <= 24) return "24h";
            if (hours <= 24) return "1d";
            if (hours <= 168) return "7d";
            return "older";
        }

        function render() {
            document.getElementById('timestamp').textContent = `Last Update: ${formatDate(data.last_updated)}`;

            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = '';

            Object.entries(data.counts).forEach(([bucket, count]) => {
                const tile = document.createElement('div');
                tile.className = 'stat-tile';
                tile.innerHTML = `
                    <div class="stat-label">${bucket}</div>
                    <div class="stat-value" style="color: ${bucketColors[bucket]}">${count}</div>
                `;
                tile.onclick = (event) => filterJobs(bucket, event);
                statsGrid.appendChild(tile);
            });

            renderJobs(data.jobs);
        }

        function renderJobs(jobs) {
            const list = document.getElementById('jobList');
            list.innerHTML = '';

            if (!jobs || jobs.length === 0) {
                list.innerHTML = '<div class="empty-state">No relevant entry-level jobs found. Try running the pipeline again.</div>';
                return;
            }

            jobs.sort((a, b) => a.hours_ago - b.hours_ago).forEach((job, index) => {
                const bucket = getBucket(job.hours_ago);
                const item = document.createElement('li');
                item.className = 'job-item';
                item.dataset.bucket = bucket;
                item.innerHTML = `
                    <div class="recency-indicator" style="background: ${bucketColors[bucket] || 'var(--text-muted)'}"></div>
                    <div class="job-info">
                        <h3>${job.title} <span style="font-size: 0.7rem; color: var(--text-muted); font-weight: 400;">#${index + 1}</span></h3>
                        <div class="job-meta">
                            <span class="meta-tag"><strong style="color: var(--text-primary)">${job.company}</strong></span>
                            <span class="meta-tag">${job.location}</span>
                            <span class="badge">${job.portal}</span>
                            <span class="meta-tag" style="font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;">${Math.round(job.hours_ago)}h ago</span>
                            ${job.relevance_score ? `<span class="badge" style="border-color: var(--accent); color: var(--accent)">Score: ${job.relevance_score}</span>` : ''}
                        </div>
                    </div>
                    <div class="job-actions">
                        <button class="tailor-btn" onclick="alert('To tailor this resume, tell Claude: /tailor job ${index + 1}')">Tailor Resume</button>
                        <a href="${job.url}" target="_blank" class="job-link">View Listing</a>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function filterJobs(bucket, event) {
            document.querySelectorAll('.stat-tile').forEach(t => t.classList.remove('active'));
            event.currentTarget.classList.add('active');

            const filterStatus = document.getElementById('filterStatus');
            filterStatus.textContent = `Filtering: ${bucket}`;

            const items = document.querySelectorAll('.job-item');
            items.forEach(item => {
                item.style.display = item.dataset.bucket === bucket ? 'grid' : 'none';
            });
        }

        render();
    </script>
